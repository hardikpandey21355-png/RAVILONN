<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login • RudelySmash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="login-body">
  <form class="login-card" method="post" autocomplete="off">
    <div class="brand" style="justify-content:center;padding-bottom:6px">
      <i><svg class="i" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg></i>
    </div>
    <h1>Admin panel</h1>
    <p class="sub">RudelySmash • Restricted area</p>
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input class="inp" type="password" name="password" placeholder="Admin password" autofocus required>
    <p class="err">{{ error }}</p>
    <button class="btn primary wide" type="submit">Log in</button>
  </form>
</body>
</html>
